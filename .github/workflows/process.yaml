name: Process
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish the results as a draft of this version (vYYYY-MM, or vYYYY-MM-DD for a hotfix) - leave empty to only run the overlays"
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
permissions:
  contents: read
env:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres"
  AWS_ENDPOINT_URL: "https://nrs.objectstore.gov.bc.ca"
  AWS_S3_ENDPOINT: "nrs.objectstore.gov.bc.ca"
  AWS_VIRTUAL_HOSTING: "FALSE"
  AWS_EC2_METADATA_DISABLED: "true"
  CPL_VSISTDIN_BUFFER_LIMIT: -1
  BUCKET: ${{ secrets.BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  harvest-restrictions:
    runs-on: ubuntu-latest
    name: harvest-restrictions
    container: ghcr.io/bcgov/harvest-restrictions-runner:main
    environment: production
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Load sources to database
        run: |
          python harvest_restrictions.py load-db sources.json -v --out_table designations
      - name: Process overlays
        run: |
          git config --global --add safe.directory /__w/harvest-restrictions/harvest-restrictions
          python harvest_restrictions.py overlay -v
      - name: Publish draft
        # only when given a version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python harvest_restrictions.py publish-draft "$VERSION" -v