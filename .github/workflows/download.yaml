name: Download
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  AWS_ENDPOINT_URL: "https://nrs.objectstore.gov.bc.ca"
  AWS_S3_ENDPOINT: "nrs.objectstore.gov.bc.ca"
  AWS_VIRTUAL_HOSTING: "FALSE"
  AWS_EC2_METADATA_DISABLED: "true"
  CPL_VSISTDIN_BUFFER_LIMIT: -1
  BUCKET: ${{ secrets.BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CPL_VSIL_CURL_USE_HEAD: "NO"
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  harvest-restrictions:
    runs-on: ubuntu-latest
    name: harvest-restrictions
    container: ghcr.io/bcgov/harvest-restrictions-runner:main
    environment: production
    env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Download sources to S3
        run: |
          python harvest_restrictions.py cache sources.json -v --out_path s3://$BUCKET/harvest_restrictions/sources