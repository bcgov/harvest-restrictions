name: harvest-restrictions
run-name: ${{ github.actor }} Full harvest-restrictions workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish the results as a draft of this version (vYYYY-MM, or vYYYY-MM-DD for a hotfix) - leave empty to only run the overlays"
        required: false
permissions:
  contents: read
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET: ${{ secrets.BUCKET }}
jobs:
  download:
    uses: ./.github/workflows/download.yaml
    secrets: inherit
  process:
    uses: ./.github/workflows/process.yaml
    secrets: inherit
    needs: download
    with:
      version: ${{ inputs.version }}