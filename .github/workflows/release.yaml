name: Release
on:
  push:
    tags:
      - 'v*'
      # release candidates are published by overlay, not released
      - '!v*-rc.*'
permissions:
  contents: read
# release read-modify-writes the change logs in object storage - run one release at a time
# so concurrent tag pushes can't drop each other's log rows. A running release is never
# cancelled; note GitHub keeps only one *pending* run per group, so if a third tag is pushed
# while one runs and one waits, the waiting one is cancelled and must be re-run
concurrency:
  group: release
  cancel-in-progress: false
env:
  AWS_ENDPOINT_URL: "https://nrs.objectstore.gov.bc.ca"
  AWS_S3_ENDPOINT: "nrs.objectstore.gov.bc.ca"
  AWS_VIRTUAL_HOSTING: "FALSE"
  AWS_EC2_METADATA_DISABLED: "true"
  BUCKET: ${{ secrets.BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  release:
    runs-on: ubuntu-latest
    name: release
    container: ghcr.io/bcgov/harvest-restrictions-runner:main
    # requires a reviewer's approval before anything is published
    environment: release
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
            fetch-tags: true
            fetch-depth: 0
      - name: Publish release
        run: |
          git config --global --add safe.directory /__w/harvest-restrictions/harvest-restrictions
          python harvest_restrictions.py release -v
      - name: Prune release candidates
        # only candidates of released versions (including this one) - others are left alone
        run: python harvest_restrictions.py prune-prereleases -v
